{% extends 'base.html' %}

{% block title %}Login - Habit Garden{% endblock %}

{% block extra_css %}
<style>
    /* Login Form Styles */
    .auth-container {
        max-width: 450px;
        margin: 0 auto;
        padding: var(--spacing-xl);
    }
    
    .auth-card {
        background: var(--white);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
        padding: var(--spacing-2xl);
    }
    
    .auth-header {
        text-align: center;
        margin-bottom: var(--spacing-xl);
    }
    
    .auth-header .icon {
        font-size: 3rem;
        margin-bottom: var(--spacing-md);
    }
    
    .auth-header h1 {
        color: var(--dark-green);
        margin-bottom: var(--spacing-sm);
    }
    
    .auth-header p {
        color: var(--text-light);
    }
    
    .form-group {
        margin-bottom: var(--spacing-lg);
    }
    
    .form-group label {
        display: block;
        margin-bottom: var(--spacing-sm);
        font-weight: 500;
        color: var(--text-dark);
    }
    
    .form-group input {
        width: 100%;
        padding: var(--spacing-md);
        font-size: var(--font-size-base);
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        transition: border-color var(--transition-fast);
    }
    
    .form-group input:focus {
        outline: none;
        border-color: var(--primary-green);
        box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }
    
    .password-wrapper {
        position: relative;
    }
    
    .password-wrapper input {
        padding-right: 48px;
    }
    
    .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-light);
        font-size: var(--font-size-sm);
        padding: 4px;
        line-height: 1;
    }
    
    .password-toggle:hover {
        color: var(--primary-green);
    }
    
    .btn-login {
        width: 100%;
        padding: var(--spacing-md);
        font-size: var(--font-size-lg);
        margin-top: var(--spacing-md);
    }
    
    .auth-footer {
        text-align: center;
        margin-top: var(--spacing-lg);
        padding-top: var(--spacing-lg);
        border-top: 1px solid var(--border);
    }
    
    .auth-footer p {
        color: var(--text-light);
        margin: 0;
    }
    
    .auth-footer a {
        color: var(--primary-green);
        font-weight: 500;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="icon">🌻</div>
            <h1>Welcome Back</h1>
            <p>Login to tend to your garden</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    id="username" 
                    placeholder="Enter your username"
                    required
                    autofocus
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="Enter your password"
                        required
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword('password')">Show</button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">
                Login
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{% url 'register' %}">Sign up here</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const btn = input.parentElement.querySelector('.password-toggle');
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
    } else {
        input.type = 'password';
        btn.textContent = 'Show';
    }
}
</script>
{% endblock %}
